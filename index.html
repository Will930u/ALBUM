<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Digital de Barajitas</title>
    <link rel="stylesheet" href="ALBUM.CSS">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- Banner Header -->
        <header class="header-banner">
            <h1>ÁLBUM DIGITAL DE BARAJITAS</h1>
            <p class="sub-header">★ TEMPORADA 2026 ★</p>
        </header>

        <!-- Control de Era y Progreso -->
        <section class="era-section">
            <div class="era-title" id="era-label">ERA 1: COTIDIANOS</div>
            <div class="progreso-text" id="progreso-label">PROGRESO: 000 / 2000</div>
            <div class="nav-era-buttons">
                <button class="pixel-btn" id="btn-atras">◄ ATRÁS</button>
                <button class="pixel-btn" id="btn-siguiente">SIGUIENTE ►</button>
            </div>
        </section>

        <!-- Cuadrícula 5x5 de Casilleros -->
        <main class="grid-album-container">
            <div class="grid-album" id="grid-album">
                <!-- Se generan dinámicamente o se mantienen los 25 slots -->
            </div>
        </main>

        <!-- Barra del Pie de Álbum y Usuario -->
        <section class="album-footer-info">
            <span class="pagina-text" id="pagina-label">PÁGINA 1/40</span>
            <div class="user-badge">
                <div class="avatar-frame">
                    <img src="avatar.png" alt="Avatar" id="user-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\' viewBox=\'0 0 24 24\' fill=\'%2300ffcc\'><circle cx=\'12\' cy=\'8\' r=\'4\'/><path d=\'M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z\'/></svg>'">
                </div>
                <div class="user-details">
                    <span class="username" id="user-handle">@Utrera930</span>
                    <span class="displayname" id="user-fullname">william utrera</span>
                </div>
            </div>
        </section>

        <!-- Navegación Principal Inferior -->
        <nav class="bottom-nav">
            <button class="nav-tab active">
                <span class="tab-icon">🎴</span> ÁLBUM
            </button>
            <button class="nav-tab">
                <span class="tab-icon">🛒</span> TIENDA
            </button>
            <button class="nav-tab">
                <span class="tab-icon">🔨</span> SUBASTAS
            </button>
        </nav>
    </div>

    <script src="ALBUM.JS"></script>
</body>
</html>
