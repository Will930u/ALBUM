<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÁLBUM DIGITAL DE BARAJITAS</title>
    <!-- SDK Oficial de Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Fuente Pixel Art Retro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="album-style.css">
</head>
<body>

    <div class="interfaz-juego">
        <!-- Cabecera del Álbum -->
        <div class="cabecera-album">
            <h1 class="titulo-album">ÁLBUM DIGITAL DE BARAJITAS</h1>
            <div class="temporada-tag">★ TEMPORADA <span id="ano-actual">2026</span> ★</div>
        </div>

        <!-- Marcador de Progreso Dinámico Estilo Arcade -->
        <div class="marcador-progreso">
            <div class="linea-era"><span id="titulo-bloque">CARGANDO ERA...</span></div>
            <div class="linea-conteo">
                <span id="contador-progreso" class="resaltado-oro">PROGRESO: 000 / 2000</span>
            </div>
            <div class="controles-navegacion">
                <button class="btn-retro" id="btn-anterior">◀ ATRÁS</button>
                <button class="btn-retro" id="btn-siguiente">SIGUIENTE ▶</button>
            </div>
        </div>

        <!-- El Libro Abierto (Contenedor de la cuadrícula de 25 cartas) -->
        <div class="libro-contenedor">
            <div class="pagina-cuadrula" id="grilla-cartas">
                <!-- JavaScript inyectará aquí los 25 slots por página (del 1 al 25, 26 al 50, etc.) -->
            </div>
        </div>

        <!-- Información de Paginación y Usuario de Telegram -->
        <div class="panel-usuario-telegram">
            <span class="indicador-pagina" id="indicador-pagina">PÁGINA 1/40</span>
            <div class="perfil-telegram">
                <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar" class="avatar-tg">
                <div class="datos-tg">
                    <span id="user-username" class="tg-username">@usuario</span>
                    <span id="user-fullname" class="tg-fullname">NOMBRE COMPLETO</span>
                </div>
            </div>
        </div>
    </div>

    <!-- VENTANA MODAL VISOR: Efecto 3D y Expansión -->
    <div class="modal-visor" id="modal-visor" style="display: none;">
        <div class="carta-box-animacion" id="carta-animada">
            <div class="carta-cara cara-reverso">
                <div class="simbolo-incognita">?</div>
            </div>
            <div class="carta-cara cara-frontal" id="contenido-carta-frontal">
                <!-- Inyectado dinámicamente desde Supabase por album.js -->
            </div>
        </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN FIJA INFERIOR -->
    <div class="menu-navegacion-fijo">
        <button class="btn-nav activo" onclick="window.location.href='index.html'">📔 ÁLBUM</button>
        <button class="btn-nav" onclick="window.location.href='tienda.html'">🛒 TIENDA</button>
        <button class="btn-nav" onclick="window.location.href='subastas.html'">🔨 SUBASTAS</button>
    </div>

    <!-- Carga de Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="album.js"></script>
</body>
</html>
