<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Álbum Digital - Cyberpunk Synthwave Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="icon" type="image/png" href="album/album.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="album-style.css?v=1.2">
</head>
<body>
    <div id="pantalla-portada" class="portada-overlay">
        <div class="contenido-portada">
            <h1 class="titulo-portada">NEON<br>CYBER<br>ALBUM</h1>
            <p class="subtitulo-portada">SYNTHWAVE ERA 2026</p>
            <div class="contenedor-play">
                <span class="texto-tap">TAP TO INITIATE MATRIX</span>
                <button id="btn-play-ingresar" class="btn-play-neon" onclick="iniciarApp()">
                    <div class="triangulo-play"></div>
                </button>
            </div>
            <div class="barra-carga-box">
                <div class="barra-carga-progreso"></div>
            </div>
            <p class="texto-cargando">INICIALIZANDO MATRIZ...</p>
        </div>
    </div>

    <div class="interfaz-juego">
        <div class="cabecera-album">
            <h1 class="titulo-album">NEON CYBER ALBUM</h1>
            <div class="temporada-tag">★ SYNTHWAVE ERA <span id="ano-actual">2026</span> ★</div>
        </div>

        <div class="marcador-progreso">
            <div class="info-header-hud">
                <div class="bloque-orilla-izquierda">
                    <div class="linea-era"><span id="titulo-bloque">SECTOR 1: CYBERNETICS</span></div>
                    <div class="linea-conteo">
                        <span id="contador-progreso" class="resaltado-oro">PROGRESO: 000 / 2000</span>
                    </div>
                </div>

                <div class="panel-valor-coleccion" id="panel-valor-coleccion">
                    <span class="label-valor">VALOR COLECCIÓN:</span>
                    <div class="montos-valor">
                        <span id="valor-usd" class="monto-usd">USD: $0.00</span>
                        <span class="separador-monto">|</span>
                        <span id="valor-bs" class="monto-bs">BS: 0</span>
                    </div>
                </div>
            </div>

            <div class="controles-navegacion">
                <button class="btn-retro" id="btn-anterior">◄ ANTERIOR</button>
                <button class="btn-retro" id="btn-siguiente">SIGUIENTE ►</button>
            </div>
        </div>

        <div class="libro-contenedor">
            <div class="pagina-cuadrula" id="grilla-cartas">
                <!-- Inyectado dinámicamente por album.js -->
            </div>
        </div>

        <div class="panel-usuario-telegram">
            <span class="indicador-pagina" id="indicador-pagina">PÁGINA 1/80</span>
            <div class="perfil-telegram">
                <img id="user-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 24 24' fill='%2300f3ff'><circle cx='12' cy='8' r='4'/><path d='M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z'/></svg>" alt="Avatar" class="avatar-tg">
                <div class="datos-tg">
                    <span id="user-username" class="tg-username">@Cargando...</span>
                    <span id="user-fullname" class="tg-fullname">Jugador</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-visor" id="modal-visor" style="display: none;">
        <div class="carta-box-animacion" id="carta-animada">
            <div class="carta-cara cara-frontal" id="contenido-carta-frontal">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>

    <div class="menu-navegacion-fijo">
        <button class="btn-nav activo" onclick="window.location.href='index.html'">📔 ÁLBUM</button>
        <button class="btn-nav" onclick="window.location.href='tienda.html'">🛒 TIENDA</button>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="album.js?v=1.2"></script>
</body>
</html>
