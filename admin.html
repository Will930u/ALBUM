<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración y Generador Procedural</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>

    <div class="contenedor-central">
        <h1 class="titulo-central">[ CONSOLA DE MANDO Y GENERADOR PROCEDURAL ]</h1>

        <!-- BARRA DE PESTAÑAS SPA -->
        <div class="barra-pestanas">
            <button class="tab-btn activo" onclick="cambiarPestana('tab-crear')">🎨 CREAR CARTA</button>
            <button class="tab-btn" onclick="cambiarPestana('tab-asignar')">🎁 REGALAR</button>
            <button class="tab-btn" onclick="cambiarPestana('tab-catalogo')">📖 CATÁLOGO</button>
        </div>

        <!-- PESTAÑA 1: GENERADOR PROCEDURAL Y PUBLICADOR -->
        <div id="tab-crear" class="contenido-pestana activa">
            <div class="subtitulo-admin">GENERADOR MATEMÁTICO DE CARTA EN VIVO</div>

            <div class="contenedor-vista-previa-canvas">
                <div class="label-previa">EN VIVO: RENDERIZADO CANVAS MATEMÁTICO</div>
                <div class="canvas-wrapper">
                    <canvas id="canvasCartaGenerada" width="220" height="308"></canvas>
                </div>
                <div class="info-semilla-box" id="info-semilla">Semilla: - | Era: -</div>
                <button type="button" id="btn-randomizar" class="btn-mini-admin btn-mini-drop" style="margin-top:10px; width:100%; padding:8px;">🎲 RANDOMIZAR VALORES Y SEMILLA</button>
            </div>

            <div class="form-grupo">
                <label for="carta-id">ID DE CARTA (1 a 2000):</label>
                <input type="number" id="carta-id" placeholder="Ej: 1" min="1" max="2000">
            </div>

            <div class="form-grupo">
                <label for="carta-nombre">NOMBRE DE LA CARTA:</label>
                <input type="text" id="carta-nombre" placeholder="Ej: Guardián Místico">
            </div>

            <div class="form-grupo">
                <label for="carta-era">ERA CONCEPTUAL (PALETA Y PATRÓN):</label>
                <select id="carta-era">
                    <option value="cyber">Cyberpunk / Neón</option>
                    <option value="cotidianos">Cotidianos / Retro</option>
                    <option value="espacial">Cosmos / Estelar</option>
                    <option value="antiguo">Místico / Arcana</option>
                </select>
            </div>

            <div class="form-grupo">
                <label for="carta-rareza">RAREZA:</label>
                <select id="carta-rareza">
                    <option value="Común">Común</option>
                    <option value="Rara">Rara</option>
                    <option value="Épica">Épica</option>
                    <option value="Legendaria">Legendaria</option>
                </select>
            </div>

            <div class="form-grupo">
                <label for="carta-simbolo">SÍMBOLO / EMOJI CENTRAL:</label>
                <input type="text" id="carta-simbolo" value="👾" maxlength="2">
            </div>

            <div class="form-grupo">
                <label for="carta-lore">HISTORIA / LORE:</label>
                <input type="text" id="carta-lore" placeholder="Historia breve de la carta...">
            </div>

            <button id="btn-guardar-carta" class="btn-admin-final">💾 PUBLICAR RECETA MATEMÁTICA EN BASE DE DATOS</button>
        </div>

        <!-- PESTAÑA 2: ASIGNAR CARTA A USUARIO -->
        <div id="tab-asignar" class="contenido-pestana">
            <div class="subtitulo-admin">ENTREGAR CARTA DIRECTA A COLECCIÓN</div>
            
            <div class="form-grupo">
                <label for="target-user">USUARIO TELEGRAM (CON O SIN @):</label>
                <input type="text" id="target-user" value="utrera930">
            </div>

            <div class="form-grupo">
                <label for="target-carta-id">ID DE CARTA A REGALAR:</label>
                <input type="number" id="target-carta-id" placeholder="Ej: 1">
            </div>

            <div class="form-grupo">
                <label for="target-cantidad">CANTIDAD:</label>
                <input type="number" id="target-cantidad" value="1" min="1">
            </div>

            <button id="btn-regalar-carta" class="btn-admin-final" style="background-color: #38bdf8;">🎁 ASIGNAR CARTA A USUARIO</button>
        </div>

        <!-- PESTAÑA 3: CATÁLOGOCARTA REGISTRADAS -->
        <div id="tab-catalogo" class="contenido-pestana">
            <div class="subtitulo-admin">CATÁLOGO GLOBAL DE RECETAS PUBLICADAS</div>
            <div class="grid-cartas-admin" id="grid-catalogo-admin">
                <!-- Se puebla dinámicamente -->
            </div>
        </div>

        <div class="status-log" id="status-log" style="margin-top:15px; font-size:7px; color:#00ff66; padding:8px; background:#000; border:1px solid #333; min-height:40px; word-break:break-all;">
            Sistema inicializado. Listo para procesar algoritmos.
        </div>
    </div>

    <!-- SDK SUPABASE -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
