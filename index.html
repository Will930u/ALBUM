<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Digital - Libro de Colección Retro</title>
    <!-- CORREGIDO: Enlace espejo inmune a bloqueos de internet para la fuente Pixel Art -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="album-style.css">
</head>
<body>

    <div class="interfaz-juego">
        <!-- Marcador de Progreso Dinámico Estilo Arcade -->
        <div class="marcador-progreso">
            <span id="titulo-bloque">CARGANDO ERA...</span><br>
            <!-- Mantenemos el ID 'contador-progreso' para que tu JS actualice el PROGRESO: 000 / 000 -->
            <span id="contador-progreso" class="resaltado-oro">PROGRESO: 000 / 000</span>
        </div>

        <!-- El Libro Abierto (Contenedor de la cuadrícula de 50 cartas) -->
        <div class="libro-contenedor">
            <!-- Mantenemos el ID 'grilla-cartas' que busca tu script original para inyectar los 50 cuadros -->
            <div class="pagina-cuadrula" id="grilla-cartas">
                <!-- JavaScript inyectará aquí los 50 slots por página con el signo '?' automáticamente -->
            </div>
        </div>

        <!-- Controles de Navegación de Páginas del Libro -->
        <div class="navegacion-libro">
            <!-- Sincronizados los IDs exactos que lee tu archivo de JavaScript local -->
            <button class="btn-retro" id="btn-anterior">◀ ATRÁS</button>
            <button class="btn-retro" id="btn-siguiente">SIGUIENTE ▶</button>
        </div>
    </div>

    <!-- VENTANA MODAL VISOR: Efecto de profundidad 3D y Expansión al tocar una carta -->
    <div class="modal-visor" id="modal-visor" style="display: none;">
        <div class="carta-box-animacion" id="carta-animada">
            
            <!-- CARA TRASERA: El reverso de la carta (se visualiza durante la rotación veloz) -->
            <div class="carta-cara cara-reverso">
                <div class="simbolo-incognita" style="font-size: 50px;">?</div>
            </div>

            <!-- CARA FRONTAL: El diseño final por capas con tus marcos de naturaleza -->
            <div class="carta-cara cara-frontal" id="contenido-carta-frontal">
                <!-- Inyectado dinámicamente desde Supabase por album.js -->
            </div>

        </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN FIJA INFERIOR PARA EL JUGADOR -->
    <div class="menu-navegacion-fijo">
        <button class="btn-nav activo" onclick="window.location.href='index.html'">📔 ÁLBUM</button>
        <button class="btn-nav" onclick="window.location.href='tienda.html'">🛒 TIENDA</button>
        <button class="btn-nav" onclick="window.location.href='subastas.html'">🔨 SUBASTAS</button>
    </div>

    <!-- ======================================================= -->
    <!-- CARGA DE LIBRERÍAS: Supabase primero, luego lógica local -->
    <!-- ======================================================= -->
    <!-- CORREGIDO: unpkg.com requería la ruta completa del paquete para definir el objeto 'supabase' -->
    <script src="https://unpkg.com"></script>
    <script src="album.js"></script>
</body>
</html>
