<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola Central - Administrador</title>
    <!-- Importamos la tipografía arcade oficial -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Enlace a tu hoja de estilos externa limpia -->
    <link rel="stylesheet" href="admin-style.css">
    <!-- Cargamos la librería externa de Supabase (Obligatoria arriba) -->
    <script src="https://unpkg.com"></script>
</head>
<body>

<div class="contenedor-central">
    <h1 class="titulo-central">💻 [[ PANEL DE CONTROL SUPREMO ]] 💻</h1>

    <!-- Barra rígida de navegación SPA para moverte entre las herramientas -->
    <div class="barra-pestanas">
        <button class="tab-btn activo" onclick="cambiarPestana('pestana-carga')">📥 CARGA</button>
        <button class="tab-btn" onclick="cambiarPestana('pestana-drops')">🎁 DROPS MANUALES</button>
        <button class="tab-btn" onclick="cambiarPestana('pestana-escrow')">⚖️ ESCROW P2P</button>
    </div>

    <!-- PESTAÑA 1: CREADOR Y CARGADOR MULTIMEDIA DE CRIATURAS -->
    <div id="pestana-carga" class="contenido-pestana activa">
        <h2 class="subtitulo-admin">📥 CREADOR Y CARGADOR DE CARTAS</h2>
        
        <!-- Interruptor dinámico para ocultar o mostrar las estadísticas -->
        <div class="form-grupo">
            <label>TIPO DE CARGA:</label>
            <select id="modo-diseno-carta" onchange="conmutarCamposFormulario(this.value)">
                <option value="NORMAL">FICHA TÉCNICA (Diseño TCG por código)</option>
                <option value="LISTA">IMAGEN COMPLETA TERMINADA (Diseño externo .jpg/.png)</option>
            </select>
        </div>

        <form id="form-subir-carta">
            <div class="form-grupo">
                <label>NOMBRE DE LA CRIATURA:</label>
                <input type="text" id="carta-nombre" required placeholder="Ej: Fénix Dorado">
            </div>

            <div class="form-grupo">
                <label>RAREZA:</label>
                <select id="carta-rareza">
                    <option value="Común">Común (⭐)</option>
                    <option value="Rara">Rara (⭐⭐)</option>
                    <option value="Épica">Épica (⭐⭐⭐)</option>
                    <option value="Mitológica">Mitológica (⭐⭐⭐⭐⭐)</option>
                </select>
            </div>

            <!-- Bloque dinámico controlado por admin.js que se esconde si el arte ya viene listo -->
            <div id="bloque-estadisticas-manuales">
                <div class="form-grupo">
                    <label>TIPO / ETIQUETA:</label>
                    <input type="text" id="carta-tipo" value="Tierra" placeholder="Ej: [ Bestia Alada / Efecto ]">
                </div>

                <div class="form-grupo">
                    <label>PUNTOS DE SALUD / DEF (HP):</label>
                    <input type="number" id="carta-salud" value="100">
                </div>

                <div class="form-grupo">
                    <label>PODER DE ATAQUE (ATK):</label>
                    <input type="number" id="carta-poder" value="50">
                </div>

                <div class="form-grupo">
                    <label>NOMBRE DEL ATAQUE:</label>
                    <input type="text" id="carta-ataque" value="Embestida">
                </div>

                <div class="form-grupo">
                    <label>HÁBITAT GEOGRÁFICO:</label>
                    <input type="text" id="carta-habitat" value="Desconocido">
                </div>

                <div class="form-grupo">
                    <label>HISTORIA / LORE MÍSTICO:</label>
                    <textarea id="carta-lore" placeholder="Escribe la leyenda de la criatura..."></textarea>
                </div>
            </div>

            <!-- Nuevo inyector de archivos físicos directos de tu galería -->
            <div class="form-grupo">
                <label class="txt-verde">[ 🖼️ SELECCIONAR ARTE (.JPG / .PNG) ]</label>
                <input type="file" id="carta-archivo-jpg" accept="image/jpeg, image/png" required class="input-archivo-retro">
            </div>

            <button type="submit" class="btn-admin-final">[[ 🚀 PUBLICAR EN EL ÁLBUM GLOBAL ]]</button>
        </form>
        <!-- SECCIÓN: DESTRUCTOR DE ACTIVOS POR ID -->
        <div class="bloque-destruccion">
            <h2 class="subtitulo-admin txt-rojo">🗑️ DESTRUCTOR POR ID</h2>
            <div class="form-grupo-fila">
                <input type="number" id="id-carta-borrar" placeholder="ID CARTA (Ej: 14)">
                <button type="button" class="btn-destruir" onclick="destruirCartaYMultimediaGlobal()">BORRAR</button>
            </div>
        </div>
    </div>

    <!-- PESTAÑA 2: MODULO DE DROPS Y PREMIOS MANUALES -->
    <div id="pestana-drops" class="contenido-pestana">
        <h2 class="subtitulo-admin">🎁 DROPS Y PREMIOS MANUALES</h2>
        
        <div class="form-grupo">
            <label>ID DEL JUGADOR DESTINO (TELEGRAM ID):</label>
            <input type="text" id="regalo-usuario-id" placeholder="Ej: 57483920">
        </div>

        <div class="form-grupo">
            <label>MODALIDAD DE REGALO:</label>
            <select id="regalo-tipo-seleccion">
                <option value="AZAR">PAQUETE DE CARTAS AL AZAR</option>
                <option value="ESPECIFICA">CARTA ESPECÍFICA POR ID</option>
            </select>
        </div>

        <div class="form-grupo">
            <label>ID DE CARTA ESPECÍFICA (Solo modo específico):</label>
            <input type="number" id="regalo-carta-id" placeholder="Ej: 5">
        </div>

        <div class="form-grupo">
            <label>CANTIDAD DE EJEMPLARES:</label>
            <input type="number" id="regalo-cantidad" value="1">
        </div>

        <button type="button" id="btn-enviar-regalo" class="btn-admin-final">[[ 🎁 INYECTAR DROP ]]</button>
    </div>

    <!-- PESTAÑA 3: LIQUIDACIÓN ESCROW DE COMPRAS EN BOLÍVARES -->
    <div id="pestana-escrow" class="contenido-pestana">
        <h2 class="subtitulo-admin">⚖️ LIQUIDACIÓN ESCROW (10% COMISIÓN)</h2>
        <p class="nota-auditoria">Confirma los ingresos en tu Pago Móvil real antes de validar los sobres:</p>
        
        <div class="tabla-contenedor">
            <table class="tabla-retro">
                <thead>
                    <tr>
                        <th>LOTE</th>
                        <th>BRUTO</th>
                        <th>10% (GANANCIA)</th>
                        <th>NETO VEND.</th>
                        <th>ESTADO</th>
                    </tr>
                </thead>
                <tbody id="tabla-escrow-cuerpo">
                    <!-- JavaScript inyectará las filas de transacciones bancarias en vivo -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Enlace final al archivo de control lógico de operaciones del Administrador -->
<script src="admin.js"></script>
</body>
</html>
